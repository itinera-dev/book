[package]
name = "itinera-book"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "The Rust examples of the Itinera book."
license = "MIT OR Apache-2.0"

[dependencies]
itinera = { git = "https://github.com/itinera-dev/itinera-rs", rev = "788c6f2f0aa9bcdd5450292903fe58a9af6feae6", features = ["async"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
# The same commit as above, with the `testing` feature that chapters 26 to 29 use: bump both together.
itinera = { git = "https://github.com/itinera-dev/itinera-rs", rev = "788c6f2f0aa9bcdd5450292903fe58a9af6feae6", features = ["testing"] }
snapbox = { version = "0.6", features = ["regex"] }
regex = "1"
serde_json = "1"

# The programs of compile-errors/ must not compile. They are examples only with this feature, so
# that `cargo build --examples` skips them and tests/compile_errors.rs builds each one on its own.
# So `--all-features` builds them too, and fails.
[features]
compile-errors = []

[[bin]]
name = "ch26_testing_a_step_alone"
path = "tested/ch26_testing_a_step_alone.rs"

[[bin]]
name = "ch27_testing_a_hook_or_an_adapter_alone"
path = "tested/ch27_testing_a_hook_or_an_adapter_alone.rs"

[[bin]]
name = "ch28_testing_the_flow_with_scripted_steps"
path = "tested/ch28_testing_the_flow_with_scripted_steps.rs"

[[bin]]
name = "ch29_testing_a_whole_journey"
path = "tested/ch29_testing_a_whole_journey.rs"

[[example]]
name = "ch24_instance_run_twice"
path = "compile-errors/ch24_instance_run_twice.rs"
required-features = ["compile-errors"]

[[example]]
name = "ch33_duplicate_step_name"
path = "compile-errors/ch33_duplicate_step_name.rs"
required-features = ["compile-errors"]

[[example]]
name = "ch33_hook_defined_twice"
path = "compile-errors/ch33_hook_defined_twice.rs"
required-features = ["compile-errors"]

[[example]]
name = "ch33_invalid_lifecycle"
path = "compile-errors/ch33_invalid_lifecycle.rs"
required-features = ["compile-errors"]

[[example]]
name = "ch33_mode_not_accepted"
path = "compile-errors/ch33_mode_not_accepted.rs"
required-features = ["compile-errors"]

[[example]]
name = "ch33_not_a_value"
path = "compile-errors/ch33_not_a_value.rs"
required-features = ["compile-errors"]

[[example]]
name = "ch33_role_not_provided"
path = "compile-errors/ch33_role_not_provided.rs"
required-features = ["compile-errors"]
