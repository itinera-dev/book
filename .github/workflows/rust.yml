name: Rust book

# Runs every example of the Rust book and checks that it prints what the book
# shows, and that every compile error gives the message the book shows, with
# `cargo test` in rust/ (rust/tests/examples.rs and rust/tests/compile_errors.rs), and that
# every tested program builds without test support and its tests report what the book shows
# (rust/tests/tested.rs).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  examples:
    name: examples print what the book shows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - run: cargo test --locked
