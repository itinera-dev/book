[package]
name = "itinera-book"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "The Rust examples of the Itinera book."
license = "MIT OR Apache-2.0"

[dependencies]
itinera = { git = "https://github.com/itinera-dev/itinera-rs", rev = "7d5fec366c5ba6f4fe3f4a4977407885ed292f97", features = ["async"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
# The same commit as above, with the `testing` feature that chapter 24 uses: bump both together.
itinera = { git = "https://github.com/itinera-dev/itinera-rs", rev = "7d5fec366c5ba6f4fe3f4a4977407885ed292f97", features = ["testing"] }
snapbox = { version = "0.6", features = ["regex"] }
regex = "1"
