[package]
name = "itinera-book"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "The Rust examples of the Itinera book."
license = "MIT OR Apache-2.0"

[dependencies]
itinera = { git = "https://github.com/itinera-dev/itinera-rs", rev = "c99accf4c8c42bf781b519636925f862a54cc3ca", features = ["async"] }
futures = { version = "0.3", default-features = false, features = ["executor"] }

[dev-dependencies]
itinera = { git = "https://github.com/itinera-dev/itinera-rs", rev = "c99accf4c8c42bf781b519636925f862a54cc3ca", features = ["testing"] }
snapbox = { version = "0.6", features = ["regex"] }
regex = "1"
