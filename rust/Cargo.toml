[package]
name = "itinera-book"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "The Rust examples of the Itinera book."
license = "MIT OR Apache-2.0"

[dependencies]
itinera = { git = "https://github.com/itinera-dev/itinera-rs", rev = "b2296011cc9a41d6a76f58cc582d959d74163978", features = ["async"] }
futures = { version = "0.3", default-features = false, features = ["executor"] }
