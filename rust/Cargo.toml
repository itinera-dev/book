[package]
name = "itinera-book"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "The Rust examples of the Itinera book."
license = "MIT OR Apache-2.0"

[dependencies]
itinera = { version = "=0.1.0-beta.3", features = ["async"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
# The same version as above, with the `testing` feature that chapters 27 to 30 use: bump both together.
itinera = { version = "=0.1.0-beta.3", features = ["testing"] }
snapbox = { version = "0.6", features = ["regex"] }
regex = "1"
serde_json = "1"

# The programs of compile-errors/ must not compile. They are examples only with this feature, so
# that `cargo build --examples` skips them and tests/compile_errors.rs builds each one on its own.
# So `--all-features` builds them too, and fails.
[features]
compile-errors = []

[[bin]]
name = "ch27_testing_a_step_alone"
path = "tested/ch27_testing_a_step_alone.rs"

[[bin]]
name = "ch27_testing_a_step_alone_async"
path = "tested/ch27_testing_a_step_alone_async.rs"

[[bin]]
name = "ch28_testing_a_hook_or_an_adapter_alone"
path = "tested/ch28_testing_a_hook_or_an_adapter_alone.rs"

[[bin]]
name = "ch28_testing_a_hook_or_an_adapter_alone_async"
path = "tested/ch28_testing_a_hook_or_an_adapter_alone_async.rs"

[[bin]]
name = "ch29_testing_the_flow_with_scripted_steps"
path = "tested/ch29_testing_the_flow_with_scripted_steps.rs"

[[bin]]
name = "ch29_testing_the_flow_with_scripted_steps_async"
path = "tested/ch29_testing_the_flow_with_scripted_steps_async.rs"

[[bin]]
name = "ch30_testing_a_whole_journey"
path = "tested/ch30_testing_a_whole_journey.rs"

[[bin]]
name = "ch30_testing_a_whole_journey_async"
path = "tested/ch30_testing_a_whole_journey_async.rs"

[[bin]]
name = "ch43_working_with_agents"
path = "tested/ch43_working_with_agents.rs"

[[bin]]
name = "ch43_working_with_agents_async"
path = "tested/ch43_working_with_agents_async.rs"

[[example]]
name = "ch24_instance_run_twice"
path = "compile-errors/ch24_instance_run_twice.rs"
required-features = ["compile-errors"]

[[example]]
name = "ch37_duplicate_step_name"
path = "compile-errors/ch37_duplicate_step_name.rs"
required-features = ["compile-errors"]

[[example]]
name = "ch37_hook_defined_twice"
path = "compile-errors/ch37_hook_defined_twice.rs"
required-features = ["compile-errors"]

[[example]]
name = "ch37_invalid_lifecycle"
path = "compile-errors/ch37_invalid_lifecycle.rs"
required-features = ["compile-errors"]

[[example]]
name = "ch37_result_not_awaited"
path = "compile-errors/ch37_result_not_awaited.rs"
required-features = ["compile-errors"]

[[example]]
name = "ch37_not_a_value"
path = "compile-errors/ch37_not_a_value.rs"
required-features = ["compile-errors"]

[[example]]
name = "ch37_role_not_provided"
path = "compile-errors/ch37_role_not_provided.rs"
required-features = ["compile-errors"]
