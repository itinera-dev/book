[package]
name = "itinera-book"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "The Rust examples of the Itinera book."
license = "MIT OR Apache-2.0"

[dependencies]
itinera = { git = "https://github.com/itinera-dev/itinera-rs", rev = "baa2e2d8e7767f421d640e30b9e08fba9d5f30ab", features = ["async"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
# The same commit as above, with the `testing` feature that chapters 24 to 27 use: bump both together.
itinera = { git = "https://github.com/itinera-dev/itinera-rs", rev = "baa2e2d8e7767f421d640e30b9e08fba9d5f30ab", features = ["testing"] }
snapbox = { version = "0.6", features = ["regex"] }
regex = "1"
serde_json = "1"

# The programs of compile-errors/ must not compile. They are examples only with this feature, so
# that `cargo build --examples` skips them and tests/compile_errors.rs builds each one on its own.
# So `--all-features` builds them too, and fails.
[features]
compile-errors = []

[[example]]
name = "ch22_instance_run_twice"
path = "compile-errors/ch22_instance_run_twice.rs"
required-features = ["compile-errors"]

[[example]]
name = "ch30_duplicate_step_name"
path = "compile-errors/ch30_duplicate_step_name.rs"
required-features = ["compile-errors"]

[[example]]
name = "ch30_hook_defined_twice"
path = "compile-errors/ch30_hook_defined_twice.rs"
required-features = ["compile-errors"]

[[example]]
name = "ch30_invalid_lifecycle"
path = "compile-errors/ch30_invalid_lifecycle.rs"
required-features = ["compile-errors"]

[[example]]
name = "ch30_mode_not_accepted"
path = "compile-errors/ch30_mode_not_accepted.rs"
required-features = ["compile-errors"]

[[example]]
name = "ch30_not_a_value"
path = "compile-errors/ch30_not_a_value.rs"
required-features = ["compile-errors"]

[[example]]
name = "ch30_role_not_provided"
path = "compile-errors/ch30_role_not_provided.rs"
required-features = ["compile-errors"]
