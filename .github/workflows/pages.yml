name: Pages

# Builds the book's web pages from site/ and runs their verify gate on every
# pull request, every push to main or next and every tag of a release, such as
# rust-0.1.0-beta.1. A pull request also builds every edition with its own
# site. Once a push passes the gate, the Deploy workflow publishes every
# edition, as deploy.yml says.

on:
  pull_request:
  push:
    branches: [main, next]
    tags: ['*-[0-9]*']

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. A run after a push
# is never cancelled once it has started, so the Deploy workflow always follows
# it; a newer push to the same branch only replaces a run that is still waiting.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - if: github.event_name == 'pull_request'
        run: npm run editions
