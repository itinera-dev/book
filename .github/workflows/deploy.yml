name: Deploy

# Once the Pages workflow passes after a push to main or next or a tag of a
# release, builds every published edition from main, as
# site/scripts/editions.mjs says, and publishes them to GitHub Pages at
# https://itinera-dev.org/book/. It runs through workflow_run, which runs on
# main: a release is tagged on a commit main has already deployed, and Pages
# ignore a deployment from a tag of a commit they already serve, while still
# reporting it as successful. Each edition comes from its own branch or tag,
# so main moving past a tag changes no frozen edition. After deploying,
# site-live reads editions.json as readers get it, and fails if Pages do not
# serve what was built.

on:
  workflow_run:
    workflows: [Pages]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editions:
    name: build every edition
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One build of every edition at a time, so a deployment never replaces a
    # newer snapshot of the branches and tags with an older one.
    concurrency:
      group: pages-editions
      cancel-in-progress: false
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run editions
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editions
          path: site/dist/editions.json

  deploy:
    name: deploy
    needs: editions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: editions
      - uses: itinera-dev/actions/site-live@v1
        with:
          url: ${{ steps.deployment.outputs.page_url }}editions.json
          expected: editions.json
